modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# displayURL / issueTrackerURL / iconFile / logoFile are mod-specific and MUST live in
# the [[mods]] table; placed at the top level NeoForge silently ignores them
# and the mod-list homepage button stays disabled.
# 26.2+ NeoForge splits the mod-list artwork into two slots (iconFile = square 1:1 icon
# in the left list, bannerFile = wide banner on the right). 26.1.x and earlier only know
# the deprecated logoFile. This branch spans 26.1~26.2, so both keys are declared:
# 26.2+ picks iconFile, 26.1.x falls back to logoFile. We only ship a 1:1 icon.
displayURL = "https://www.curseforge.com/minecraft/mc-mods/authcmd"
issueTrackerURL = "https://github.com/Huziyang520/AuthCmd/issues"
iconFile = "assets/authcmd/textures/authcmd.png"
logoFile = "assets/authcmd/textures/authcmd.png"
authors = "${mod_author}"
description = '''
[EN] Restrict which commands players can execute and which game modes they can switch to, based on configurable permission lists.
[CN] 基于可配置的权限名单，限制玩家可执行的指令，以及可切换的游戏模式。
'''
[[mixins]]
config = "authcmd.mixins.json"
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
# AvalonBase 前置（支持库）：可选，安装后启用暂停界面可视化编辑按钮
modId = "avalonbase"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "BEFORE"
side = "BOTH"
