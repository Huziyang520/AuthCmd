license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# displayURL / issueTrackerURL / iconFile are mod-specific and MUST live in
# the [[mods]] table; placed at the top level NeoForge silently ignores them
# and the mod-list homepage button stays disabled.
# 26.2+ NeoForge splits the mod-list artwork into two slots: iconFile (square
# 1:1 icon shown in the LEFT list) and bannerFile (wide banner shown on the
# RIGHT detail page). We only ship a 1:1 icon, so use iconFile -- using the
# deprecated logoFile would render the square icon in the RIGHT banner slot.
displayURL = "https://www.curseforge.com/minecraft/mc-mods/authcmd"
issueTrackerURL = "https://github.com/Huziyang520/AuthCmd/issues"
iconFile = "assets/authcmd/textures/authcmd.png"
authors = "${mod_author}"
description = '''
[EN] Restrict which commands players can execute and which game modes they can switch to, based on configurable permission lists.
[CN] 基于可配置的权限名单，限制玩家可执行的指令，以及可切换的游戏模式。
'''
[[mixins]]
config = "authcmd.mixins.json"
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
# AvalonBase 前置（支持库）：可选，安装后启用暂停界面可视化编辑按钮
modId = "avalonbase"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "BEFORE"
side = "BOTH"