plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            programArguments.addAll '--username', 'Dev'
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly files(rootProject.file(avalonbase_jar))

    implementation "com.camelot:camelot-neoforge-${mc_range_label}:${camelot_version}"
    jarJar "com.camelot:camelot-neoforge-${mc_range_label}:${camelot_version}"
}

configurations.configureEach {
    if (name.startsWith('neoFormRuntime')) {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.apache.logging.log4j') {
                details.useVersion('2.19.0')
            }
        }
    }
}
