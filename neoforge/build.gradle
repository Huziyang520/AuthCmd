plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}
base {
    archivesName = "${mod_id}-neoforge-${mc_range_label}"
}

neoForge {
    version = neoforge_version

    // Automated decoration of Dependencies for Dev/Prod builds, and ModMaven publishing
    addModdingDependenciesTo(sourceSets.main)

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev'
        }
        server {
            server()
        }
    }
}

dependencies {
    // AvalonBase 前置支持库：仅编译期需要（运行时由 neoforge.mods.toml 声明可选前置）。
    // 编译期来源与 fabric 子项目一致（common 源码经由 multiloader-loader 注入，需各自声明引用）。
    // 固定文件名：build/libs 永久保留各旧版 jar（铁律不删），通配会把多个版本同时放进 classpath；
    // AvalonBase 升版时必须同步修改此处文件名。
    compileOnly fileTree(project.file("../../../AvalonBase/1.21.2-1.21.5/neoforge/build/libs")) {
        include "AvalonBase-neoforge-1.21.5-1.5.1.jar"
    }
    compileOnly project(":common")

    // nightconfig（TOML）：NeoForge 运行时自带，编译期显式声明以解析 common 的引用
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'
}
