plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev'
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "com.camelot:camelot-neoforge-${mc_range_label}:${camelot_version}"
    jarJar "com.camelot:camelot-neoforge-${mc_range_label}:${camelot_version}"

    compileOnly fileTree(project.file("../../../AvalonBase/1.21-1.21.1/neoforge/build/libs")) {
        include "avalonbase-neoforge-1.21-1.21.1-1.5.1.jar"
        exclude "*sources*", "*javadoc*"
    }
}
