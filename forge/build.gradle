plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.parchmentmc.librarian.forgegradle'
    id 'org.spongepowered.mixin' version '0.7.+'
}

apply from: "${rootDir}/gradle/avalon-base.gradle"

mixin {
    // 为 main 源码集生成 refmap（Mojang/parchment 命名 → SRG），并注入运行配置与 Jar Manifest 的 MixinConfigs 键
    add sourceSets.main, 'authcmd.refmap.json'
    config 'authcmd.mixins.json'
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'client'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'server'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // AvalonBase 前置支持库：本项目的 source set 包含 common 的源码目录（由 multiloader-loader
    // 注入），因此这里也必须提供 com.avalon.* 才能编译 gui / NetworkRegistration。
    //
    // 必须经 fg.deobf 处理：发布 jar 是 SRG 映射，直接 implementation 会导致
    // 其中引用的 MC 类型对不上当前 named 映射，仍然编译失败。
    //
    // 用 compileOnly 而非 implementation：AvalonBase 是可选前置，不应进入运行时依赖；
    // 未安装时由 AvalonLink.isAvalonLoaded() 兜底。dev 环境若要测 GUI，
    // 把 jar 放进 forge/run/mods/ 即可。
    // jar 定位逻辑见 gradle/avalon-base.gradle。
    compileOnly fg.deobf(files(resolveAvalonJar('forge')))

    // nightconfig（TOML）：Forge 运行时自带，编译期显式声明以解析 common 的引用
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

// ForgeGradle 6 自动处理 reobf
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = targetCompatibility = '17'
}

jar {
    finalizedBy('reobfJar')
}
