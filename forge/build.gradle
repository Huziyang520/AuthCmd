plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin' version '0.7.+'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('runs/client')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('runs/server')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    camelotEmbed
}

dependencies {
    camelotEmbed("com.camelot:camelot-forge-${mc_range_label}:${camelot_version}@jar") {
        transitive = false
    }

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(':common')
    compileOnly files(rootProject.file(avalonbase_jar))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation("com.camelot:camelot-forge-${mc_range_label}:${camelot_version}") {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = targetCompatibility = '17'
}

tasks.register('camelotJarJarMetadata') {
    def outFile = layout.buildDirectory.file('jarjar/metadata.json')
    outputs.file(outFile)
    doLast {
        def jarFile = configurations.camelotEmbed.singleFile
        outFile.get().asFile.parentFile.mkdirs()
        outFile.get().asFile.text = """{"jars":[{"identifier":{"group":"com.camelot","artifact":"camelot-forge-${mc_range_label}"},"version":{"range":"[1.0.0,)","artifactVersion":"${camelot_version}"},"path":"META-INF/jarjar/${jarFile.name}","isObfuscated":true}]}"""
    }
}

jar {
    dependsOn 'camelotJarJarMetadata'
    // 混淆环境下 @Redirect 的 method 必须靠 refmap 重映射；AP 只把它写进 tmp/compileJava。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('tmp/compileJava')) {
        include "${mod_id}.refmap.json"
    }
    from({ configurations.camelotEmbed.singleFile }) {
        into 'META-INF/jarjar'
    }
    from(layout.buildDirectory.dir('jarjar')) {
        into 'META-INF/jarjar'
    }
    finalizedBy('reobfJar')
}
