# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.2.1
group=com.authcmd.mod
$117

# Common
$11.20.1
mod_name=AuthCmd
mod_author=Huziyang520
mod_id=authcmd
license=MIT
credits=
description=Restrict which commands players can execute and which game modes they can switch to, based on a configurable permission list. \nThe AvalonBase support library is optional and only required for the visual editing GUI on the pause screen. \nFeedback: https://github.com/Huziyang520/AuthCmd/issues or https://issue.mengcai.online/
minecraft_version_range=[1.20, 1.20.2)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
$10.92.1+1.20.1
$10.16.9

# Forge
$147.2.30
forge_loader_version_range=[47,)

# Gradle
# 3G 对 ForgeGradle 首次反编译偏紧，容易在 GC 里空转（表现类似卡死）
org.gradle.jvmargs=-Xmx4G
# daemon 关闭会导致每次构建重启 JVM、重解析依赖，迭代开发时很慢
org.gradle.daemon=true
