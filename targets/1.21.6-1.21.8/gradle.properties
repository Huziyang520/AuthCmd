# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# 版本号全线共用：同一分支内所有 target 一起改号。
# Project
version=1.4.3
group=com.authcmd.mod
java_version=21

# Common
minecraft_version=1.21.8
mc_range_label=1.21.6-1.21.8
mod_name=AuthCmd
mod_author=Huziyang520
mod_id=authcmd
license=MIT
credits=
description=Restrict which commands players can execute and which game modes they can switch to, based on a configurable permission list. \nThe AvalonBase support library is optional and only required for the visual editing GUI on the pause screen. \nFeedback: https://github.com/Huziyang520/AuthCmd/issues or https://issue.mengcai.online/
minecraft_version_range=[1.21.6, 1.21.9)
# NeoForm version used to remap the 'common' module for 1.21.8
# 取值来源：~/.gradle/caches/modules-2/files-2.1/net.neoforged/neoform（本机已有该档，不另下载）
neo_form_version=1.21.8-20250717.133445
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.8
parchment_version=2025.07.20

# Fabric
fabric_version=0.132.0+1.21.8
fabric_loader_version=0.17.2

# NeoForge
neoforge_version=21.8.35
neoforge_loader_version_range=[4,)


# 本 target 的前置库与可选依赖（不同区间路径不同，故参数化）
avalon_dir=AvalonBase/1.21.6-1.21.8
avalon_fabric_dev_jar=avalonbase-fabric-1.21.8-1.5.1-dev.jar
avalon_fabric_jar=avalonbase-fabric-1.21.8-1.5.1.jar
avalon_neoforge_jar=AvalonBase-neoforge-1.21.8-1.5.1.jar
modmenu_version=15.0.2

# target 专属源码/资源覆盖目录（相对 targets/<t>/），空 = 不覆盖。
target_overlay=overlay

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
