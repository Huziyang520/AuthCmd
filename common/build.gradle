plugins {
    id 'multiloader-common'
}

def useLoom = (findProperty('compile_plugin') ?: 'moddev') == 'loom'
if (useLoom) {
    apply plugin: 'fabric-loom'
} else {
    apply plugin: 'net.neoforged.moddev'
}

if (!useLoom) {
    neoForge {
        neoFormVersion = neo_form_version
    }
}

dependencies {
    if (useLoom) {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
    }
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    compileOnly "com.camelot:camelot-${useLoom ? 'forge' : 'common'}-${mc_range_label}:${camelot_version}"
    compileOnly files(rootProject.file(avalonbase_jar))
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
